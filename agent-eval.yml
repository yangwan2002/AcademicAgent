schema_version: "1.0"

agent:
  name: academic-agent
  description: AcademicAgent evaluation adapter for EvalCaliper

runtime:
  type: docker
  dockerfile: Dockerfile
  build_context: .
  workdir: /workspace

execution:
  mode: per_case
  command:
    - python
    - /workspace/evalcaliper/run_case.py
    - --input
    - "{input_path}"
    - --output
    - "{output_path}"
    - --trace
    - "{trace_path}"
  timeout_seconds: 300

io:
  input_path: /eval/input.json
  output_path: /eval/output.json

trace:
  enabled: true
  format: jsonl
  path: /eval/trace.jsonl
  schema: academic.benchmark.v1
  normalizer: generic_alias
  rules:
    record_selector:
      - "$[*]"
    field_aliases:
      event_type: [type, event_type, event, kind]
      span_id: [span_id, spanId, id, case_id]
      trace_id: [trace_id, traceId, run_id]
      parent_span_id: [parent_span_id, parentSpanId]
      status: [status, outcome, result]
      timestamp: [timestamp, time, "@timestamp"]
      duration_ms: [duration_ms, duration, latency_ms, elapsed_ms]
    event_aliases:
      benchmark_result: agent_end
      result: agent_end
      final: agent_end
      llm: llm_call
      tool: tool_call
      error: error

env:
  fixed:
    PAPER_LLM: deepseek
    PAPER_LLM_MODEL: deepseek-flash
    PAPER_BASE_URL: https://api.deepseek.com
    PAPER_KEY_ENV: PAPER_API_KEY
    PAPER_REVIEWER_LLM: deepseek
    PAPER_REVIEWER_LLM_MODEL: deepseek-v4-pro
    PAPER_REVIEWER_BASE_URL: https://api.deepseek.com
    PAPER_REVIEWER_KEY_ENV: PAPER_API_KEY
  secrets:
    - PAPER_API_KEY