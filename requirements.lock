# 依赖锁定 —— 完整传递闭包，精确版本
#
# 用途：让「真实跑」的环境可复现。`pyproject.toml` 的 extras 只钉上下界
# （便于库使用者解析），本文件钉死具体版本（便于部署与排障复现）。
#
# 怎么用：
#   pip install -r requirements.lock && pip install -e . --no-deps
#
# 为什么需要它：本项目的第三方依赖全在 optional-dependencies 里，且 src/ 中
# 一律惰性导入。好处是核心包零依赖可导入，代价是「装了什么版本」完全不受约束 ——
# 上界 <3 / <4 挡得住大版本破坏，挡不住小版本行为漂移。真机排障时若不能复现
# 当时的版本组合，trace 就失去对照价值。
#
# 这些版本的来源：不是解析器算出来的，是**本机实测 1941 测试全绿 + 真机跑通
# docx 润色链路**的那一组，用 importlib.metadata 导出实际闭包。
#
# 无哈希：本机无 uv / pip-compile。哈希锁（--require-hashes）需要那两个工具之一，
# 补齐后可升级本文件。当前形态防的是「版本漂移」，防不了「上游重打包同版本号」。
#
# 维护：升级依赖时重新导出，不要手改单行 —— 传递闭包会跟着变。
# 生成时间：2026-08-14　Python 3.12 / Windows
# 平台备注：colorama 仅 Windows 下由 tqdm 拉入；Linux CI 装不上也无妨（pip 会跳过
# 不匹配的平台条件，但此处无 marker，故 CI 用 pyproject extras 而非本文件）。

